# The wireless CMSIS-DAP exposes both HID and USB-bulk interfaces.  On this
# probe firmware the bulk endpoint may answer enumeration but fail CMD_INFO;
# force the proven HID path and use a conservative SWD clock.
source [find interface/cmsis-dap.cfg]
cmsis-dap backend hid
transport select swd
source [find target/stm32h7x.cfg]

# The H7 target script changes the adapter default, so apply the conservative
# clock after sourcing it.  This wireless probe does not provide a reliable
# hardware-NRST path; OpenOCD's STM32H7 system reset is the proven route.
adapter speed 1000
